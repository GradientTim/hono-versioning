name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary # bun fmt/lint need 1.4.6; switch back to bun-version-file once it is stable

      # npm >= 11.5.1 is required for trusted publishing; Node 24 ships with it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun fmt --check
      - run: bun lint
      - run: bun run type-check
      - run: bun test
      - run: bun run build

      # `bun publish` can't do trusted publishing/provenance yet (oven-sh/bun#15601),
      # so pack with bun and upload the tarball with npm.
      - run: bun pm pack --destination ./pack
      - run: bunx publint --strict
      - run: bunx attw ./pack/*.tgz --profile esm-only
      # Already checked and built above, so skip lifecycle scripts.
      - run: npm publish ./pack/*.tgz --provenance --ignore-scripts
